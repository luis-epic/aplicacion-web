packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  'argon2': true
  'esbuild': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  'prisma': true
  'sharp': true

minimumReleaseAgeExclude:
  - effect@3.20.0
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - sharp@0.35.0
  - js-yaml@5.2.2
  - brace-expansion@5.0.8

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  effect@<3.20.0: ^3.20.0
  js-yaml@>=5.0.0 <=5.2.1: ^5.2.2
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
