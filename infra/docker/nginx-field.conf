map $uri $field_cache_control {
    default "no-cache";
    ~^/sw\.js$ "no-cache, no-store, must-revalidate";
    ~*\.(?:css|js)$ "public, max-age=31536000, immutable";
    ~*\.(?:avif|svg|png|jpg|jpeg|gif|webp|woff2?)$ "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tilecache.rainviewer.com; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.rainviewer.com https://earthquake.usgs.gov; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $field_cache_control always;

    location = /api/v1/metrics {
        return 404;
    }

    location = /api/v1/metrics/ {
        return 404;
    }

    location ^~ /media/publications/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
    }

    location ~* \.(?:avif|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
    }
}
